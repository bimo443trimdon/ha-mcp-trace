[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ha-mcp"
version = "0.2.0"
description = "MCP server for setting up and maintaining Home Assistant"
requires-python = ">= 3.11"
dependencies = [
    "fastmcp>=4.1,<5",
    "aiohttp>=3.9,<4",
    "pydantic-settings>=2.0,<3",
    "pyyaml>=6.0,<7",
]

[project.scripts]
ha-mcp = "ha_mcp.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/ha_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov",
]
