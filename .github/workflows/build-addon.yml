name: Build and Publish Add-on

on:
  push:
    branches: [main]
    paths:
      - "ha_mcp_addon/**"
      - "src/**"
      - "pyproject.toml"
      - "tests/**"
  pull_request:
    branches: [main]
    paths:
      - "ha_mcp_addon/**"
      - "src/**"
      - "pyproject.toml"
      - "tests/**"
  workflow_dispatch:

env:
  IMAGE_BASE: ghcr.io/bimo443trimdon/ha-mcp-trace

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -e . pytest pytest-asyncio httpx uvicorn
      - run: pytest -q

  build:
    name: Build ${{ matrix.arch }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Prepare build context
        run: |
          chmod +x ha_mcp_addon/build-prep.sh
          ./ha_mcp_addon/build-prep.sh

      - name: Get addon version
        id: version
        run: |
          VERSION=$(python3 -c "
          import yaml
          with open('ha_mcp_addon/config.yaml') as f:
              print(yaml.safe_load(f)['version'])
          ")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Get build-from image
        id: build_from
        run: |
          BUILD_FROM=$(python3 -c "
          import yaml
          with open('ha_mcp_addon/build.yaml') as f:
              print(yaml.safe_load(f)['build_from']['${{ matrix.arch }}'])
          ")
          echo "image=${BUILD_FROM}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ha_mcp_addon
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            BUILD_FROM=${{ steps.build_from.outputs.image }}
          tags: |
            ${{ env.IMAGE_BASE }}-${{ matrix.arch }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_BASE }}-${{ matrix.arch }}:latest
